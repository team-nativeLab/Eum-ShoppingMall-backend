# 테스트는 MySQL 없이 인메모리 H2로 돈다.
spring:
  datasource:
    url: jdbc:h2:mem:shopping;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    # H2 테스트는 JPA가 스키마를 만들고, MySQL 전용 Flyway SQL은 CI의 MySQL 검증에서 실행한다.
    enabled: false

cors:
  allowed-origins: http://localhost:3000

management:
  health:
    redis:
      # 이 프로파일은 Redis 없이 실행하며, Redis 연동 검증은 필터 단위 테스트에서 대역으로 수행한다.
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

security:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef
  rate-limit:
    # 테스트는 한 IP에서 로그인을 수없이 반복하므로 사실상 끈다. 제한 동작은 RateLimitFilterTests에서 따로 검증한다.
    requests-per-minute: 100000

upload:
  dir: build/test-uploads

app:
  scheduling:
    # 주기 작업은 테스트에서 직접 호출한다.
    enabled: false
  seed:
    # 테스트는 빈 DB에서 시작한다. 기본 카테고리 생성은 테스트에서 직접 호출해 검증한다.
    default-categories: false
