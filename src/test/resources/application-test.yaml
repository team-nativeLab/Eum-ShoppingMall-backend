# 테스트는 MySQL 없이 인메모리 H2로 돈다.
spring:
  datasource:
    url: jdbc:h2:mem:shopping;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # 요청 하나가 SQL을 몇 번 실행하는지 테스트에서 확인할 수 있게 한다(Statistics.getPrepareStatementCount).
    properties:
      hibernate.generate_statistics: true
  flyway:
    # H2 테스트는 JPA가 스키마를 만들고, MySQL 전용 Flyway SQL은 CI의 MySQL 검증에서 실행한다.
    enabled: false

cors:
  allowed-origins: http://localhost:3000

management:
  health:
    redis:
      # 이 프로파일은 Redis 없이 실행하며, Redis 연동 검증은 필터 단위 테스트에서 대역으로 수행한다.
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

security:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef
  rate-limit:
    # 테스트는 한 IP에서 로그인을 수없이 반복하므로 사실상 끈다. 제한 동작은 RateLimitFilterTests에서 따로 검증한다.
    requests-per-minute: 100000
  login-lock:
    # 테스트는 같은 이메일로 로그인 실패를 여러 번 반복하므로 사실상 끈다. 잠금 동작은 LoginLockTests에서 따로 검증한다.
    max-failures: 100000

upload:
  dir: build/test-uploads

app:
  cache:
    # 검색 캐시 Redis 호출은 단위 테스트에서 대역으로 검증한다.
    product-ttl-seconds: 0
    # 회원 상태 캐시도 끈다. 테스트가 DB를 직접 고쳐 정지 상태 등을 만들기 때문이다. 캐시 동작은 단위 테스트에서 검증한다.
    member-token-state-ttl-seconds: 0
  scheduling:
    # 주기 작업은 테스트에서 직접 호출한다.
    enabled: false
  seed:
    # 테스트는 빈 DB에서 시작한다. 기본 카테고리 생성은 테스트에서 직접 호출해 검증한다.
    default-categories: false

logging:
  level:
    # generate_statistics가 세션마다 남기는 통계 로그는 끈다.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
