# 로컬 개발 전용. compose.yaml의 MySQL에 붙는다.
# 여기 적힌 키·계정은 공개된 값이므로 운영에서는 절대 이 프로파일을 쓰지 않는다.
# 실행: ./gradlew bootRun (자동으로 이 프로파일 적용) 또는 IDE 실행 설정에서 Active profiles = local
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping
    username: shopping
    password: shopping
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 기존 로컬 DB는 엔티티 update로 만들어졌을 수 있다. 로컬에서만 기존 스키마를 V1으로 인식한다.
    baseline-on-migrate: true
    baseline-version: 1

cors:
  allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    secret: local-dev-only-jwt-secret-do-not-use-in-production
    # 로컬은 HTTP라서 Secure 쿠키를 받지 않는 브라우저가 있다.
    refresh-cookie-secure: false

admin:
  bootstrap:
    email: admin@example.com
    password: local-admin-1234
