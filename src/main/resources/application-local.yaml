# 로컬 개발 전용. compose.yaml의 MySQL에 붙는다.
# 여기 적힌 키·계정은 공개된 값이므로 운영에서는 절대 이 프로파일을 쓰지 않는다.
# 실행: ./gradlew bootRun (자동으로 이 프로파일 적용) 또는 IDE 실행 설정에서 Active profiles = local
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping
    username: shopping
    password: shopping
  jpa:
    hibernate:
      # 로컬에서만 엔티티 기준으로 테이블을 자동 생성한다. 스키마가 굳으면 Flyway로 옮긴다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    secret: local-dev-only-jwt-secret-do-not-use-in-production
    # 로컬은 HTTP라서 Secure 쿠키를 받지 않는 브라우저가 있다.
    refresh-cookie-secure: false

admin:
  bootstrap:
    email: admin@example.com
    password: local-admin-1234
