# 공통 설정. 비밀 값과 환경마다 다른 값은 환경변수로만 받고 기본값을 두지 않는다.
# 프로파일 없이 띄우면 필수 환경변수가 없어 기동에 실패하는데, 이는 의도한 동작이다.
# (로컬 개발용 값이 운영에 실수로 적용되는 일을 막는다. 로컬에서는 local 프로파일로 띄운다.)
spring:
  application:
    name: shopping
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Keep pool sizing configurable per DB instance and application replica count.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME_MS:1800000}
  transaction:
    # Bound how long a transaction may hold a connection. Tune with real workload data.
    default-timeout: ${DB_TRANSACTION_TIMEOUT_SECONDS:10s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
      jakarta:
        persistence:
          # JPA query timeout is expressed in milliseconds.
          query:
            timeout: ${DB_QUERY_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 응답을 멈춰도 요청이 오래 묶이지 않게 짧게 둔다. 넘기면 각 기능의 대체 동작(DB 조회 등)으로 넘어간다.
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
    web:
      pageable:
        # ?size=에 큰 값을 넣어 한 번에 대량 조회하는 것을 막는다.
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    # 검증에 실패한 입력값(비밀번호 등)이 예외 메시지에 실려 로그로 남지 않게 한다. (개발 도구가 켜져 있어도 끈다.)
    log-resolved-exception: false

logging:
  level:
    # Hibernate는 SQL 오류 메시지를 그대로 남기는데, 중복 오류에는 겹친 값(이메일 등)이 들어 있다(#139).
    # 예외는 GlobalExceptionHandler가 종류와 제약 이름만 남기고, 예상하지 못한 오류는 스택 트레이스와 함께 남긴다.
    org.hibernate.orm.jdbc.error: off
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [requestId=%X{requestId:-}] %-5level %logger{36} - %msg%n%ex"
  structured:
    format:
      # 로그 수집 도구가 읽을 한 줄 JSON 형식(ecs, logstash, gelf). 비워 두면 위 패턴으로 남긴다.
      console: ${LOG_FORMAT:}

server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false
    remoteip:
      # Set this to the exact proxy CIDRs in each deployment. Only trusted peers may supply forwarded client IPs.
      internal-proxies: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Redis는 넣지 않는다. Redis가 멈추면 로드밸런서가 모든 서버를 내려 Redis와 상관없는 기능까지 멈추기 때문이다.
          # Redis를 쓰는 기능은 장애 때 대체 동작으로 계속 응답하고, Redis 상태는 /actuator/health(관리자)와 지표로 본다.
          include: readinessState
  health:
    redis:
      enabled: true

cors:
  # 쿠키를 쓰는 프론트엔드 주소 전체(고객 사이트와 관리자 화면). 회원 Refresh 쿠키(재발급·로그아웃)는 이 Origin에서 온 요청만 받는다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # 위 목록 중 관리자 화면 주소. 관리자 Refresh 쿠키는 이 Origin에서 온 요청만 받아, 고객 사이트에서는 관리자 세션을 쓸 수 없다(#163).
  # 비어 있으면 브라우저의 관리자 재발급을 모두 거절해, 관리자는 Access 토큰이 끝날 때마다(15분) 다시 로그인해야 한다.
  admin-origins: ${CORS_ADMIN_ORIGINS:}
  allowed-methods: GET, POST, PUT, DELETE, OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# API 문서 UI는 운영에 노출되지 않도록 기본은 끄고, 로컬 등 필요한 환경에서만 켠다.
# 문서 설정(인증, 고객·관리자 그룹, 공개 API 표시)은 OpenApiConfig에 있다.
springdoc:
  # 검색 조건(@ModelAttribute)과 페이지(Pageable)를 page·size·sort 같은 개별 쿼리 파라미터로 펼쳐 보여 준다.
  default-flat-param-object: true
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    # 태그는 이름순, 응답 시간 표시. 토큰은 브라우저에 저장하지 않는다(새로 고치면 다시 넣는다).
    tags-sorter: alpha
    display-request-duration: true

security:
  jwt:
    secret: ${JWT_SECRET}
    # Access 토큰 15분, Refresh 토큰 14일
    access-token-expiry: 900
    refresh-token-expiry: 1209600
    refresh-cookie-secure: true
    token-validity-in-seconds: 500
    # Strict by default. Set to None only when frontend/API are cross-site and both use HTTPS.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
  rate-limit:
    # 로그인·회원가입·문의 접수·주문·결제 등에 적용하는 IP별 분당 요청 한도
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    # 공개 상품 조회의 IP별 분당 한도. 목록·필터 개수(브랜드 포함)·상세를 각각 따로 세고, 자동 완성은 이 값의 두 배다.
    # 한 사무실 직원들이 같은 공인 IP로 접속하므로 넉넉하게 둔다. 크롤링 같은 대량 요청은 프록시·WAF에서 막는다.
    public-product-requests-per-minute: ${PUBLIC_PRODUCT_RATE_LIMIT_PER_MINUTE:300}
  login-lock:
    # 한 이메일이 첫 실패부터 10분 안에 이만큼 틀리면 다음 로그인부터 로봇 확인을 요구한다(app.captcha를 켰을 때). IP를 바꿔 가며 비밀번호를 넣어 보는 공격 대비.
    # 막지 않으므로 남이 일부러 틀려도 주인은 로그인할 수 있다(#141).
    captcha-after-failures: ${LOGIN_CAPTCHA_AFTER_FAILURES:5}
    # 로봇 확인을 껐을 때만: 이만큼 틀리면 그 10분 동안 로그인을 막는다.
    max-failures: ${LOGIN_LOCK_MAX_FAILURES:10}
  verification-lock:
    # 이메일 인증번호(회원가입·비밀번호 재설정)를 첫 실패부터 1시간 안에 이만큼 틀리면 다음부터 로봇 확인을 요구한다(app.captcha를 켰을 때).
    captcha-after-failures: 3
    # 이만큼 틀리면 그때부터 1시간 동안 그 이메일로 인증번호를 받거나 확인할 수 없다.
    max-failures: 5
  admin:
    # 관리자 로그인에 OTP(TOTP) 2단계 인증을 요구한다(#164). 끄더라도 OTP를 등록한 관리자는 OTP를 확인한다. 운영에서는 끄지 않는다.
    mfa-required: ${ADMIN_MFA_REQUIRED:true}
    # OTP 앱에 보일 서비스 이름
    mfa-issuer: ${ADMIN_MFA_ISSUER:Eum Shopping}
    # 관리자가 이 시간 동안 재발급하지 않으면(쓰지 않으면) 다시 로그인해야 한다. 개인정보의 안전성 확보조치 기준 제6조의 접속 자동 차단
    session-idle-timeout: ${ADMIN_SESSION_IDLE_TIMEOUT:30m}
    # 로그인한 뒤 이 시간이 지나면 계속 쓰고 있어도 다시 로그인해야 한다.
    session-max-lifetime: ${ADMIN_SESSION_MAX_LIFETIME:8h}
  audit:
    # 관리자 한 명이 10분 안에 개인정보 조회 API(ApiPolicy.AUDITED_READS)를 이만큼 부르면 담당자에게 알린다(#138).
    bulk-read-alert-threshold: ${ADMIN_BULK_READ_ALERT_THRESHOLD:100}
  request:
    # JSON 요청 본문의 최대 크기(바이트). 파일 업로드는 위의 multipart 설정이 따로 제한한다.
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}

admin:
  bootstrap:
    # 두 값이 모두 있으면, 서버가 뜰 때 이 이메일의 계정이 없는 경우에 한해 관리자 계정을 만든다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

payment:
  toss:
    # 토스페이먼츠 시크릿 키. 비어 있으면 결제 승인·취소가 실패한다.
    secret-key: ${TOSS_SECRET_KEY:}

upload:
  # local stores files on disk; s3 uses the bucket/CDN settings below.
  storage: ${UPLOAD_STORAGE:local}
  dir: ${UPLOAD_DIR:uploads}
  s3:
    bucket: ${UPLOAD_S3_BUCKET:}
    region: ${AWS_REGION:}
    cdn-base-url: ${UPLOAD_CDN_BASE_URL:}
    # 업로드 전용 IAM 사용자의 액세스 키. 값은 서버 환경변수로만 넣는다.
    access-key: ${UPLOAD_S3_ACCESS_KEY:}
    secret-key: ${UPLOAD_S3_SECRET_KEY:}
    # 직접 업로드 주소(Presigned URL)가 유효한 시간(분, 3~60)
    presigned-url-expiration-minutes: ${UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:10}
  cleanup:
    # 상품·배너가 쓰지 않는 업로드 이미지를 지우는 시각. 올린 지 min-age-hours가 지난 파일만 지운다.
    cron: ${UPLOAD_CLEANUP_CRON:0 30 4 * * *}
    min-age-hours: ${UPLOAD_CLEANUP_MIN_AGE_HOURS:24}
    # 설정·데이터 오류로 쓰는 파일까지 지우는 사고를 줄이려고 한 번에 지우는 수를 제한한다.
    max-deletes-per-run: ${UPLOAD_CLEANUP_MAX_DELETES_PER_RUN:1000}

app:
  audit:
    # 관리자 감사 로그 보존 기간(일). 지난 로그는 매일 05:15에 지운다. 접속기록 보관 기준에 맞춰 365 이상만 받는다.
    retention-days: ${AUDIT_LOG_RETENTION_DAYS:730}
  retention:
    # 개인정보 보유 기간(일, #134). 지나면 매일 05:30에 개인정보만 지운다(PersonalDataRetentionCleaner). 개인정보 처리방침과 맞춘다.
    # 끝난 주문의 배송지. 전자상거래법 계약·대금결제·재화 공급 기록(5년)보다 짧게는 받지 않는다.
    order-days: ${ORDER_PERSONAL_DATA_RETENTION_DAYS:1825}
    # 답변한 1:1 문의의 연락처·내용. 소비자 불만·분쟁 처리 기록(3년)보다 짧게는 받지 않는다.
    inquiry-days: ${INQUIRY_PERSONAL_DATA_RETENTION_DAYS:1095}
    # 완료한 견적 문의의 회사·담당자·연락처·내용
    quote-days: ${QUOTE_PERSONAL_DATA_RETENTION_DAYS:1095}
    # 보냈거나 최종 실패한 알림 발송 기록(수신 번호·답변 내용)
    notification-days: ${NOTIFICATION_RETENTION_DAYS:90}
  alert:
    # 확인이 필요한 상황을 메일로 받을 담당자 이메일(쉼표로 구분). 비어 있으면 로그와 지표로만 남긴다. 메일 서버(MAIL_HOST)도 설정해야 보낸다.
    emails: ${ALERT_EMAILS:}
  auth:
    # true면 회원가입에 이메일 인증 토큰이 필요하다. 프론트가 인증 화면을 붙이고 메일 서버(MAIL_HOST)를 설정한 뒤 켠다.
    signup-email-verification-required: ${SIGNUP_EMAIL_VERIFICATION_REQUIRED:false}
  captcha:
    # 인증번호를 여러 번 틀린 요청에 로봇 확인(Cloudflare Turnstile)을 요구한다.
    # 프론트가 Turnstile 위젯(사이트 키)을 붙이고 서버에 비밀 키를 넣은 뒤 켠다. 꺼 두면 틀린 횟수 차단(security.verification-lock)만 동작한다.
    enabled: ${CAPTCHA_ENABLED:false}
    secret-key: ${CAPTCHA_SECRET_KEY:}
    # 위젯을 풀 수 있는 프론트 도메인(쉼표로 구분, 예: shop.example.com). 다른 사이트에서 푼 토큰은 받지 않는다. 켜면 필수다.
    allowed-hostnames: ${CAPTCHA_ALLOWED_HOSTNAMES:}
    # Turnstile 토큰 확인 주소
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    service-name: ${MAIL_SERVICE_NAME:이음 쇼핑몰}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 5000
  cache:
    # 공개 상품 조회의 공유 Redis 캐시 TTL (초)
    product-ttl-seconds: ${PRODUCT_READ_CACHE_TTL_SECONDS:60}
    # Access 토큰 검증용 회원 상태(계정 상태·토큰 버전)의 Redis 캐시 TTL (초). 0이면 요청마다 DB에서 읽는다.
    # 앱을 거치지 않고 DB에서 직접 회원을 정지하면 이 시간이 지나야 반영된다.
    member-token-state-ttl-seconds: ${MEMBER_TOKEN_STATE_CACHE_TTL_SECONDS:300}
  seed:
    # 카테고리가 하나도 없으면 기본 카테고리(안전모, 보안경, 안전장갑, 방진마스크, 안전화, 귀마개)를 만든다.
    default-categories: ${SEED_DEFAULT_CATEGORIES:true}
  client:
    # 앱이 구동할 때 받아 가는 설정 (GET /api/v1/app/config)
    min-version: ${APP_MIN_VERSION:1.0.0}
    latest-version: ${APP_LATEST_VERSION:1.0.0}
    maintenance: ${APP_MAINTENANCE:false}
    maintenance-message: ${APP_MAINTENANCE_MESSAGE:}
  notification:
    alimtalk:
      # 문의 답변 알림톡 템플릿 코드. 알림톡 대행사 콘솔에서 승인받은 코드를 넣는다.
      # 템플릿 변수: #{문의번호}, #{접수일}(예: 2026-11-09), #{답변}. 사용자가 쓴 문의 제목은 넣지 않는다(#165).
      # 대행사가 정해지기 전에는 알림을 보내지 않고 SKIPPED로 기록한다.
      inquiry-answer-template: ${ALIMTALK_INQUIRY_ANSWER_TEMPLATE:INQUIRY_ANSWER}
