# 공통 설정. 비밀 값과 환경마다 다른 값은 환경변수로만 받고 기본값을 두지 않는다.
# 프로파일 없이 띄우면 필수 환경변수가 없어 기동에 실패하는데, 이는 의도한 동작이다.
# (로컬 개발용 값이 운영에 실수로 적용되는 일을 막는다. 로컬에서는 local 프로파일로 띄운다.)
spring:
  application:
    name: shopping
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Keep pool sizing configurable per DB instance and application replica count.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME_MS:1800000}
  transaction:
    # Bound how long a transaction may hold a connection. Tune with real workload data.
    default-timeout: ${DB_TRANSACTION_TIMEOUT_SECONDS:10s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
      jakarta:
        persistence:
          # JPA query timeout is expressed in milliseconds.
          query:
            timeout: ${DB_QUERY_TIMEOUT_MS:5000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        # ?size=에 큰 값을 넣어 한 번에 대량 조회하는 것을 막는다.
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    # 검증에 실패한 입력값(비밀번호 등)이 예외 메시지에 실려 로그로 남지 않게 한다. (개발 도구가 켜져 있어도 끈다.)
    log-resolved-exception: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [requestId=%X{requestId:-}] %-5level %logger{36} - %msg%n%ex"

server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false
    remoteip:
      # Set this to the exact proxy CIDRs in each deployment. Only trusted peers may supply forwarded client IPs.
      internal-proxies: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Redis backs request limits and access-token revocation/version checks.
          include: readinessState,redis
  health:
    redis:
      enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# API 문서 UI는 운영에 노출되지 않도록 기본은 끄고, 로컬 등 필요한 환경에서만 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    # Access 토큰 15분, Refresh 토큰 14일
    access-token-expiry: 900
    refresh-token-expiry: 1209600
    refresh-cookie-secure: true
    # Strict by default. Set to None only when frontend/API are cross-site and both use HTTPS.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
  rate-limit:
    # 로그인·회원가입·문의 접수·주문·결제 등에 적용하는 IP별 분당 요청 한도
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    # 자동완성을 포함한 공개 상품 조회의 IP별 분당 한도
    public-product-requests-per-minute: ${PUBLIC_PRODUCT_RATE_LIMIT_PER_MINUTE:120}
  request:
    # JSON 요청 본문의 최대 크기(바이트). 파일 업로드는 위의 multipart 설정이 따로 제한한다.
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}

admin:
  bootstrap:
    # 두 값이 모두 있으면, 서버가 뜰 때 이 이메일의 계정이 없는 경우에 한해 관리자 계정을 만든다.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

payment:
  toss:
    # 토스페이먼츠 시크릿 키. 비어 있으면 결제 승인·취소가 실패한다.
    secret-key: ${TOSS_SECRET_KEY:}

upload:
  # local stores files on disk; s3 uses the bucket/CDN settings below.
  storage: ${UPLOAD_STORAGE:local}
  dir: ${UPLOAD_DIR:uploads}
  s3:
    bucket: ${UPLOAD_S3_BUCKET:}
    region: ${AWS_REGION:}
    cdn-base-url: ${UPLOAD_CDN_BASE_URL:}
    # 업로드 전용 IAM 사용자의 액세스 키. 값은 서버 환경변수로만 넣는다.
    access-key: ${UPLOAD_S3_ACCESS_KEY:}
    secret-key: ${UPLOAD_S3_SECRET_KEY:}
    # 직접 업로드 주소(Presigned URL)가 유효한 시간(분, 3~60)
    presigned-url-expiration-minutes: ${UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:10}
  cleanup:
    # 상품·배너가 쓰지 않는 업로드 이미지를 지우는 시각. 올린 지 min-age-hours가 지난 파일만 지운다.
    cron: ${UPLOAD_CLEANUP_CRON:0 30 4 * * *}
    min-age-hours: ${UPLOAD_CLEANUP_MIN_AGE_HOURS:24}
    # 설정·데이터 오류로 쓰는 파일까지 지우는 사고를 줄이려고 한 번에 지우는 수를 제한한다.
    max-deletes-per-run: ${UPLOAD_CLEANUP_MAX_DELETES_PER_RUN:1000}

app:
  cache:
    # 공개 상품 조회의 공유 Redis 캐시 TTL (초)
    product-ttl-seconds: ${PRODUCT_READ_CACHE_TTL_SECONDS:60}
    # Access 토큰 검증용 회원 상태(계정 상태·토큰 버전)의 Redis 캐시 TTL (초). 0이면 요청마다 DB에서 읽는다.
    # 앱을 거치지 않고 DB에서 직접 회원을 정지하면 이 시간이 지나야 반영된다.
    member-token-state-ttl-seconds: ${MEMBER_TOKEN_STATE_CACHE_TTL_SECONDS:300}
  seed:
    # 카테고리가 하나도 없으면 기본 카테고리(안전모, 보안경, 안전장갑, 방진마스크, 안전화, 귀마개)를 만든다.
    default-categories: ${SEED_DEFAULT_CATEGORIES:true}
  client:
    # 앱이 구동할 때 받아 가는 설정 (GET /api/v1/app/config)
    min-version: ${APP_MIN_VERSION:1.0.0}
    latest-version: ${APP_LATEST_VERSION:1.0.0}
    maintenance: ${APP_MAINTENANCE:false}
    maintenance-message: ${APP_MAINTENANCE_MESSAGE:}
