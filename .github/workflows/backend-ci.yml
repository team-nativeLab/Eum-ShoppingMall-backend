name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Validate database migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shopping
          MYSQL_USER: shopping
          MYSQL_PASSWORD: shopping
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start application against an empty MySQL database
        env:
          SPRING_PROFILES_ACTIVE: migration
          DB_URL: jdbc:mysql://127.0.0.1:3306/shopping
          DB_USERNAME: shopping
          DB_PASSWORD: shopping
          REDIS_HOST: 127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          JWT_SECRET: ci-only-jwt-secret-not-for-any-deployment
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash gradlew bootRun --no-daemon --console=plain >"$log_file" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; cat "$log_file"' EXIT

          for attempt in $(seq 1 90); do
            if grep -q 'Started ShoppingApplication' "$log_file"; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          cat "$log_file"
          echo "Application did not start with Flyway migration and Hibernate validation."
          exit 1

  terraform:
    name: Validate AWS infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without AWS credentials
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  container-image:
    name: Build production container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag eum-shopping-backend:ci .

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build
        run: bash gradlew test build --no-daemon --console=plain
