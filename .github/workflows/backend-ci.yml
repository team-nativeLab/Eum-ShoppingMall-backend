name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Validate database migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shopping
          MYSQL_USER: shopping
          MYSQL_PASSWORD: shopping
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # RDS 파라미터 그룹(log_bin_trust_function_creators=1)과 같게 맞춘다. 바이너리 로그가 켜진 MySQL에서는
      # 이 값이 없으면 마이그레이션 계정이 감사 로그 보호 트리거(V25)를 만들 수 없다.
      - name: Allow the migration account to create triggers
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      # 운영의 migrate 작업과 같은 방식으로 돌린다(#131). Flyway를 적용하고 Hibernate가 스키마를 검증한 뒤
      # MigrationOnlyRunner가 종료 코드 0으로 끝나야 통과한다. 운영 API는 Flyway를 끄고 이 결과를 검증만 한다.
      - name: Run the migration task against an empty MySQL database
        env:
          SPRING_PROFILES_ACTIVE: migrate
          DB_URL: jdbc:mysql://127.0.0.1:3306/shopping
          DB_USERNAME: shopping
          DB_PASSWORD: shopping
          REDIS_HOST: 127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          JWT_SECRET: ci-only-jwt-secret-not-for-any-deployment
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'cat "$log_file"' EXIT
          if ! timeout 300 bash gradlew bootRun --no-daemon --console=plain >"$log_file" 2>&1; then
            echo "Migration task did not finish with Flyway migration and Hibernate validation."
            exit 1
          fi
          grep -q 'Started ShoppingApplication' "$log_file"

  terraform:
    name: Validate AWS infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stacks/app
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize providers without AWS credentials
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Validate the state bucket bootstrap
        run: |
          terraform -chdir=../../bootstrap init -backend=false -input=false
          terraform -chdir=../../bootstrap validate

      - name: Test Terraform plans with a mocked AWS provider
        run: terraform test

  container-image:
    name: Build production container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag eum-shopping-backend:ci .

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build
        run: bash gradlew test build --no-daemon --console=plain
