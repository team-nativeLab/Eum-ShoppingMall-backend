# 업로드 이미지 CloudFront(Terraform의 aws_cloudfront_distribution.uploads)를 보호하는 WAF.
# - CloudFront용 WAF는 us-east-1에만 만들 수 있다. 서비스 리전(ap-northeast-2)과 다르므로 배포할 때 리전을 꼭 지정한다.
#   aws cloudformation deploy --region us-east-1 --stack-name eum-shopping-edge-waf --template-file infra/edge-waf.yml
# - API는 CloudFront를 거치지 않고 ALB로 바로 들어오므로 이 WAF로 보호되지 않는다.
# - Terraform 밖에서 관리하므로 docs/deployment-aws.md의 고정 비용에 없다. 웹 ACL $5 + 규칙 2개 $2 = 월 $7이고, 요청 100만 건당 $0.60가 더 나온다.
AWSTemplateFormatVersion: '2010-09-09'
Description: 이음 쇼핑몰 업로드 이미지 CloudFront용 WAF — 공통 웹 공격과 IP별 요청 폭주를 막는다.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  NamePrefix:
    Type: String
    Default: eum-shopping
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
    ConstraintDescription: 영문 소문자로 시작하고 영문 소문자·숫자·하이픈으로 된 3~21자여야 합니다.
    Description: 리소스 이름 앞에 붙는 접두어. Terraform의 name 변수와 같게 둔다.
  # 상품 목록 한 페이지에 이미지가 24개씩 나오고 한 사무실 직원들이 같은 공인 IP를 쓰므로 넉넉하게 둔다.
  # CloudFront 캐시에 있는 이미지 요청도 WAF를 거치므로 함께 센다.
  RateLimitPerFiveMinutes:
    Type: Number
    Default: 10000
    MinValue: 100
    Description: IP 하나가 5분 동안 보낼 수 있는 이미지 요청 수. 넘으면 차단한다.

Resources:
  EdgeWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${NamePrefix}-edge-web-acl'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${NamePrefix}-edge-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommonRules
          Priority: 0
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedCommonRules
            SampledRequestsEnabled: true
        - Name: RateLimit
          Priority: 1
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref RateLimitPerFiveMinutes
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimit
            SampledRequestsEnabled: true
      # Terraform의 default_tags와 같은 태그를 붙여 비용을 함께 볼 수 있게 한다.
      Tags:
        - Key: Project
          Value: !Ref NamePrefix
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  WebAclArn:
    Description: 이 ARN을 Terraform의 aws_cloudfront_distribution.uploads에 web_acl_id로 연결해야 WAF가 적용된다.
    Value: !GetAtt EdgeWebAcl.Arn
